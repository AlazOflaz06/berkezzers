<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berkezzers</title>
<meta name="description" content="Berkezzers — video izleme platformu">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e50914'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' font-size='44' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e50914'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' font-size='44' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --bg2:#0f0f0f; --panel:#151515; --panel2:#1b1b1b; --line:#262626; --hover:#232323;
  --red:#e50914; --red2:#ff2b38; --redDim:rgba(229,9,20,.15);
  --text:#e9e9e9; --muted:#8c8c8c; --muted2:#5e5e5e; --green:#6fb04c;
  --wrap:1440px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,"Segoe UI",sans-serif;font-size:13px;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 16px}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:6px}

/* ---------- Üst bar ---------- */
.top{background:#000;border-bottom:1px solid #111}
.top .wrap{display:flex;align-items:center;gap:22px;height:66px}
.logo{display:flex;align-items:center;font-weight:900;font-size:27px;letter-spacing:-1px;white-space:nowrap}
.logo .w{color:#fff;margin-right:2px}
.logo .r{background:var(--red);color:#fff;padding:1px 7px 2px;border-radius:5px;margin-left:2px}
.search{flex:1;max-width:640px;display:flex;height:38px}
.search select{background:var(--panel2);border:1px solid var(--line);border-right:none;border-radius:4px 0 0 4px;padding:0 8px;font-size:13px;outline:none}
.search input{flex:1;min-width:0;background:#fff;color:#000;border:none;padding:0 12px;outline:none;font-size:14px}
.search button{width:52px;background:var(--red);color:#fff;border-radius:0 4px 4px 0;display:grid;place-items:center}
.search button:hover{background:var(--red2)}
.top-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:4px;font-weight:700;font-size:13px;white-space:nowrap}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red2)}
.btn-dark{background:var(--panel2);border:1px solid var(--line)}.btn-dark:hover{background:var(--hover)}
.mob{display:none}

/* ---------- Menü bar ---------- */
.menu{background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.menu .wrap{display:flex;overflow-x:auto;scrollbar-width:none}
.menu .wrap::-webkit-scrollbar{display:none}
.menu a{position:relative;display:flex;align-items:center;gap:6px;padding:0 16px;height:44px;font-weight:700;text-transform:uppercase;font-size:12.5px;letter-spacing:.3px;color:#cfcfcf;white-space:nowrap}
.menu a:hover{color:#fff;background:#151515}
.menu a.active{color:#fff}
.menu a.active::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--red)}
.menu a svg{color:var(--red)}

/* ---------- Bölüm başlığı ---------- */
main{padding:18px 0 30px;min-height:60vh}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.sec-head h1,.sec-head h2{font-size:20px;font-weight:700;color:#fff}
.sec-head h1 small,.sec-head h2 small{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px}
.tabs button{padding:6px 12px;border-radius:3px;font-weight:700;font-size:12px;color:#bbb}
.tabs button.on{background:var(--red);color:#fff}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cat{padding:6px 12px;border:1px solid var(--line);background:var(--panel);border-radius:3px;font-weight:700;font-size:12px;color:#ccc}
.cat:hover{border-color:#444;color:#fff}
.cat.on{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- Video ızgarası ---------- */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px 12px}
.card{min-width:0;cursor:pointer}
.th{position:relative;aspect-ratio:16/9;background:#0b0b0b;border-radius:4px;overflow:hidden}
.th video{width:100%;height:100%;object-fit:cover;display:block}
.th .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.85);color:#fff;font-size:11.5px;font-weight:700;padding:2px 5px;border-radius:3px}
.th .hd{position:absolute;left:5px;top:5px;background:var(--red);color:#fff;font-size:10px;font-weight:900;padding:1px 4px;border-radius:2px}
.th .new{position:absolute;right:5px;top:5px;background:#fff;color:#000;font-size:10px;font-weight:900;padding:1px 5px;border-radius:2px}
.th .pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
.card:hover .th{outline:2px solid var(--red);outline-offset:-2px}
.card h3{margin-top:7px;font-size:13.5px;font-weight:700;line-height:1.35;color:#eee;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:hover h3{color:var(--red2)}
.stats{display:flex;align-items:center;gap:10px;margin-top:5px;color:var(--muted);font-size:12px}
.stats .up{display:flex;align-items:center;gap:3px;color:var(--green);font-weight:700}
.stats .up svg{width:13px;height:13px}
.stats .ch{color:#aaa;font-weight:700}

/* Boş alan (henüz yüklenmemiş video) */
.slot .th{border:1px dashed #333;display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(135deg,#0c0c0c 0 10px,#101010 10px 20px)}
.slot .th div{color:var(--muted);font-size:12px;line-height:1.5;padding:8px}
.slot .th b{display:block;color:var(--red2);font-size:22px;font-weight:900}
.slot h3{color:var(--muted)}
.slot:hover .th{outline-color:#444}

.sk .th{background:linear-gradient(90deg,#111 25%,#1a1a1a 50%,#111 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

.pager{display:flex;justify-content:center;gap:6px;margin-top:28px}
.pager button{min-width:36px;height:36px;border-radius:4px;background:var(--panel);border:1px solid var(--line);font-weight:700}
.pager button.on{background:var(--red);border-color:var(--red);color:#fff}
.pager button:disabled{opacity:.35;cursor:default}

.empty{text-align:center;color:var(--muted);padding:70px 16px;font-size:14px}
.empty b{display:block;color:#fff;font-size:18px;margin-bottom:6px}

/* ---------- İzleme sayfası ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}
.player{background:#000;aspect-ratio:16/9;width:100%}
.player video{width:100%;height:100%;display:block;background:#000}
.w-title{font-size:20px;font-weight:700;color:#fff;margin:14px 0 10px;line-height:1.3}
.w-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.w-views{font-size:15px;color:#ccc}.w-views b{color:#fff;font-size:17px}
.rate{display:flex;align-items:center;gap:14px}
.rbtn{display:flex;align-items:center;gap:6px;font-weight:700;color:#bbb;padding:6px 8px;border-radius:4px}
.rbtn:hover{background:var(--panel2);color:#fff}
.rbtn.on{color:var(--red2)}
.rbtn.on svg{fill:currentColor}
.rmeter{min-width:150px}
.rmeter .pct{font-weight:900;font-size:15px;color:#fff;text-align:right}
.rmeter .bar{height:4px;background:#444;border-radius:2px;overflow:hidden;margin-top:4px}
.rmeter .bar div{height:100%;background:var(--red)}
.w-acts{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.w-acts .btn{height:32px}
.w-acts .btn.on{background:var(--red);border-color:var(--red);color:#fff}
.info{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;line-height:1.6}
.info .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.info .lbl{color:var(--muted);font-weight:700;min-width:80px}
.tag{background:var(--panel2);border:1px solid var(--line);padding:3px 9px;border-radius:3px;font-size:12px;font-weight:700}
.tag:hover{border-color:var(--red);color:#fff}
.uploader{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.uploader .av{width:38px;height:38px;border-radius:4px;background:var(--red);display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff}
.uploader b{font-size:15px;color:#fff}
.uploader small{display:block;color:var(--muted)}
.uploader .btn{margin-left:auto}
.desc{color:#ccc;white-space:pre-wrap;margin-top:8px}

.side h4,.below h2{font-size:15px;font-weight:700;color:#fff;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--red);display:inline-block}
.side .card{display:flex;gap:8px;margin-bottom:10px}
.side .th{width:150px;flex-shrink:0}
.side .card h3{margin-top:0;font-size:12.5px}
.side .card .stats{font-size:11px}
.ad{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;text-align:center;color:var(--muted);margin-bottom:14px}
.ad b{display:block;color:#fff;font-size:15px;margin-bottom:4px}

.below{margin-top:26px}
.comments{margin-top:24px}
.cform{display:flex;gap:8px;margin:10px 0 16px}
.cform input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 12px;outline:none}
.cform input:focus{border-color:var(--red)}
.cmt{border-bottom:1px solid #161616;padding:10px 0;display:flex;gap:10px}
.cmt .av{width:32px;height:32px;border-radius:4px;background:#2b2b2b;display:grid;place-items:center;font-weight:900}
.cmt b{color:#fff}.cmt small{color:var(--muted);margin-left:6px}
.cmt p{margin-top:3px;line-height:1.5;word-break:break-word}
.cmt .del{color:var(--muted2);font-size:11px;margin-top:4px}.cmt .del:hover{color:var(--red2)}

/* ---------- Footer ---------- */
footer{background:var(--bg2);border-top:1px solid var(--line);margin-top:30px;padding:28px 0 calc(20px + env(safe-area-inset-bottom))}
footer .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
footer h5{color:#fff;font-size:13px;text-transform:uppercase;margin-bottom:10px}
footer a{display:block;color:var(--muted);margin-bottom:6px}
footer a:hover{color:#fff}
footer .copy{border-top:1px solid var(--line);margin-top:20px;padding-top:14px;color:var(--muted2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal.show{display:flex}
.box{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:6px;overflow:hidden}
.box .bh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.box .bh h2{font-size:17px;color:#fff}
.box .bb{padding:18px;max-height:70vh;overflow-y:auto}
.drop{border:2px dashed #3a3a3a;border-radius:6px;padding:26px 14px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--red);background:var(--redDim);color:#fff}
.drop .fn{color:var(--red2);font-weight:700;margin-top:6px}
.note{background:#1a0f10;border:1px solid #3b1418;color:#d8b3b6;border-radius:4px;padding:10px;margin-top:12px;line-height:1.5}
.field{margin-top:12px}
.field label{display:block;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:#0c0c0c;border:1px solid var(--line);border-radius:4px;padding:9px 10px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.box .bf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:var(--red);color:#fff;font-weight:700;padding:11px 16px;border-radius:4px;z-index:90;transition:transform .25s}
.toast.show{transform:translate(-50%,0)}

/* ---------- Responsive ---------- */
@media (max-width:1280px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:1050px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .watch{grid-template-columns:1fr}
  .side{display:none}
  footer .cols{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:720px){
  .wrap{padding:0 10px}
  .top .wrap{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;gap:10px}
  .logo{font-size:23px}
  .search{order:3;flex-basis:100%;max-width:none}
  .search select{display:none}
  .search input{border-radius:4px 0 0 4px}
  .top-r .txt{display:none}
  .top-r .btn{padding:0 11px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 8px}
  .card h3{font-size:12.5px}
  .stats{font-size:11px;gap:7px}
  .sec-head h1,.sec-head h2{font-size:17px}
  .tabs{width:100%;overflow-x:auto}
  .tabs button{flex:1;white-space:nowrap}
  main{padding-top:12px}
  .watch .player{margin:0 -10px;width:calc(100% + 20px)}
  .w-title{font-size:17px}
  .rate{width:100%;justify-content:space-between}
  .modal{align-items:flex-end;padding:0}
  .box{max-width:none;border-radius:10px 10px 0 0}
  .toast{bottom:20px}
}
@media (max-width:380px){ .grid{grid-template-columns:1fr} }

/* =================== PROFESYONEL GÖRÜNÜM =================== */
body{font-family:Inter,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 500px at 50% -200px,rgba(229,9,20,.10),transparent 70%),#000}
::selection{background:var(--red);color:#fff}
.top{background:linear-gradient(180deg,#0b0b0b,#000)}
.logo{font-size:28px;letter-spacing:-1.2px}
.logo .r{box-shadow:0 0 18px rgba(229,9,20,.55);border-radius:6px}
.search{border-radius:6px;box-shadow:0 0 0 1px #1d1d1d}
.search:focus-within{box-shadow:0 0 0 2px var(--red)}
.search select{border-radius:6px 0 0 6px}
.search button{border-radius:0 6px 6px 0}
.btn{border-radius:6px;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.menu{background:rgba(12,12,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.menu a{font-weight:700;letter-spacing:.5px}

.sec-head h1,.sec-head h2{padding-left:12px;border-left:4px solid var(--red);line-height:1.15}
.cat{border-radius:999px;padding:7px 14px;transition:all .15s}
.tabs{border-radius:8px}.tabs button{border-radius:6px;transition:background .15s}

/* Kartlar */
.th{border-radius:8px;transition:transform .2s,box-shadow .2s}
.th::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.th .dur,.th .hd,.th .new,.th .pbar{z-index:2}
.card:hover .th{outline:none;transform:translateY(-3px);box-shadow:0 12px 26px rgba(229,9,20,.28),0 0 0 2px var(--red)}
.card h3{font-weight:600;margin-top:9px}
.stats .ch{display:flex;align-items:center;gap:5px}
.stats .ch::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.slot:hover .th{transform:none;box-shadow:0 0 0 1px #444}

/* Öne çıkan */
.hero{position:relative;border-radius:12px;overflow:hidden;margin-bottom:18px;cursor:pointer;aspect-ratio:21/8;min-height:220px;background:#090909;
  box-shadow:0 20px 50px rgba(0,0,0,.6);border:1px solid #1a1a1a}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:34px;
  background:linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.6) 45%,transparent 75%),linear-gradient(0deg,rgba(0,0,0,.7),transparent 50%)}
.hero-tag{align-self:flex-start;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:5px 10px;border-radius:4px}
.hero h2{font-size:34px;font-weight:900;letter-spacing:-1px;color:#fff;max-width:640px;line-height:1.1}
.hero p{color:#bdbdbd;font-size:14px}
.hero .btn{align-self:flex-start;height:44px;padding:0 22px;font-size:14px}
.hero:hover .btn-red{background:var(--red2)}

.statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}
.stat{background:linear-gradient(180deg,#121212,#0c0c0c);border:1px solid #1d1d1d;border-radius:10px;padding:14px 16px}
.stat b{display:block;font-size:22px;font-weight:900;color:#fff}
.stat span{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat:first-child b{color:var(--red2)}

/* İzleme */
.player{border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.watch.theater{grid-template-columns:1fr}
.watch.theater .side{display:none}
.w-acts .btn.on{box-shadow:0 0 14px rgba(229,9,20,.4)}
.speed{height:32px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:13px;font-weight:700;outline:none}
.info,.ad{border-radius:10px}
.ad{background:linear-gradient(135deg,#2a0507,#0e0e0e);border-color:#3a0b0f}
.ad b{color:var(--red2)}
.uploader .av{border-radius:8px;box-shadow:0 0 12px rgba(229,9,20,.4)}

/* Yukarı çık */
.totop{position:fixed;right:18px;bottom:22px;width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;
  z-index:60;opacity:0;pointer-events:none;transform:translateY(10px);transition:all .2s;box-shadow:0 8px 20px rgba(229,9,20,.4)}
.totop.show{opacity:1;pointer-events:auto;transform:none}

/* Mobil alt menü */
.bnav{display:none}
@media (max-width:1050px){ .statbar{grid-template-columns:repeat(2,1fr)} }
@media (max-width:720px){
  .hero{aspect-ratio:16/10;border-radius:10px}
  .hero-ov{padding:18px;background:linear-gradient(0deg,rgba(0,0,0,.95),rgba(0,0,0,.2) 70%)}
  .hero h2{font-size:22px}
  .hero p{font-size:12px}
  .hero .btn{height:38px}
  .stat{padding:10px 12px}.stat b{font-size:18px}
  .menu{display:none}
  body{padding-bottom:calc(62px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(8,8,8,.96);backdrop-filter:blur(12px);
    border-top:1px solid #1c1c1c;padding-bottom:env(safe-area-inset-bottom)}
  .bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:10.5px;font-weight:600;color:#9a9a9a}
  .bnav a.active{color:#fff}.bnav a.active svg{color:var(--red)}
  .bnav svg.i{width:21px;height:21px}
  .bnav .plus svg{width:36px;height:36px;padding:8px;border-radius:50%;background:var(--red);color:#fff;stroke-width:2.6;box-shadow:0 4px 14px rgba(229,9,20,.5)}
  .totop{bottom:calc(76px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
  .theaterBtn{display:none!important}
}
</style>
</head>
